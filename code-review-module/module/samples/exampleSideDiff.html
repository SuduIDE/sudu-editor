<!DOCTYPE html>
<html>
<head>
  <title>Sudu SideDiff sample</title>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
  <style>
    html, body {
      height: 100%;
      background-color: #2b2b2b;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .diff {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    .left, .right {
      position: relative;
      width: 50%;
      height: 100%;
    }

    #toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      background-color: #333333;
      border-bottom: 1px solid #454545;
      color: #cccccc;
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 12px;
      user-select: none;
    }

    #toolbar .title { font-weight: 600; }

    #toolbar .search {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    #toolbar button {
      background-color: #3c3c3c;
      color: #cccccc;
      border: 1px solid #555555;
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    #toolbar button:hover { background-color: #4a4a4a; }

    #toolbar input[type="search"] {
      width: 150px;
      background-color: #2b2b2b;
      color: #cccccc;
      border: 1px solid #555555;
      border-radius: 3px;
      padding: 3px 6px;
      font-size: 12px;
    }

    #search-status {
      color: #9d9d9d;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
<div id="toolbar">
  <span class="title">Side diff</span>
  <span class="search">
    <input id="search-input" type="search" value="window" placeholder="highlight text" autocomplete="off"/>
    <button id="range-prev" type="button" title="previous highlight from the caret via selectPrevRange">prev</button>
    <button id="range-next" type="button" title="next highlight from the caret via selectNextRange">next</button>
    <button id="clear-highlights" type="button" title="clear SideDiffView.highlightRanges">clear</button>
    <span id="search-status"></span>
  </span>
</div>
<div class="diff">
  <div class="left" id="left1"></div>
  <div class="right" id="right1"></div>
</div>
<div class="diff">
  <div class="left" id="left2"></div>
  <div class="right" id="right2"></div>
</div>

<script type="module" charset="utf-8" src="exampleSideDiff.js"></script>

</body>
</html>
