name: "Build and Publish"

on:
  push:
    tags:
      - v0.[0-9]+.[0-9]+
      - v0.[0-9]+.[0-9]+-rc[0-9]+
      - v0.[0-9]+.[0-9]+-beta[0-9]+
      - v0.[0-9]+.[0-9]+-alpha[0-9]+

  pull_request:
    branches:
      - master

  workflow_dispatch:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write  # Required for OIDC

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: 'sudu-editor'
      - name: Checkout TeaVM
        uses: actions/checkout@v7
        with:
          repository: 'kirillp/teavm'
          ref: 'master'
          path: 'teavm'
      - name: Checkout Antlr4 TeaVM compatible repo
        uses: actions/checkout@v7
        with:
          repository: 'pertsevpv/antlr4-teavm-compatible'
          ref: 'master'
          path: 'antlr4'
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Node
        uses: actions/setup-node@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          node-version: '26' # Node 20 or 24 is required for modern npm
          registry-url: 'https://registry.npmjs.org'
          scope: '@sudu-ide'
      - name: Upgrade npm CLI
        if: github.event_name == 'push' && github.ref_type == 'tag'
        # Trusted Publishing requires npm v11.5.1 or newer
        run: npm install -g npm@latest
      - name: Restore Maven and Gradle Cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: sudu-editor-cache
      - name: Maven TeaVM
        run: |
          cd $GITHUB_WORKSPACE/teavm
          ./gradlew publishToMavenLocal --no-daemon -x test
      - name: Maven Antlr4
        run: |
          cd $GITHUB_WORKSPACE/antlr4
          mvn install -DskipTests
      - name: Maven Sudu Editor, Code Review and DiffEngine
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          cd $GITHUB_WORKSPACE/sudu-editor 
          mvn package -am -pl :codicon -pl :fonts -P downloadFont
          mvn package -am -pl code-review-module,demo-edit-es-module -P build-ssh,release
      - name: Save Maven Cache
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: sudu-editor-cache
      - name: Publish Sudu Editor packages to NPM Registry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          NEW_VERSION=$(echo ${{ github.ref_name }} | tr -d 'v')
          echo "::notice::version \"${NEW_VERSION}\""
          if [[ "$NEW_VERSION" == *-* ]]; then
            NPM_TAG="alpha"
          else
            NPM_TAG="latest"
          fi
          cd $GITHUB_WORKSPACE/sudu-editor/common-ts-types
          npm publish --access public --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/sudu-editor/demo-edit-es-module/module
          npm publish --access public --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/sudu-editor/code-review-module/module
          npm publish --access public --tag "$NPM_TAG"
