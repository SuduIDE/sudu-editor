name: "Build and Publish"

on:
  push:
    tags:
      - v0.[0-9]+.[0-9]+
      - v0.[0-9]+.[0-9]+-rc[0-9]+
      - v0.[0-9]+.[0-9]+-beta[0-9]+
      - v0.[0-9]+.[0-9]+-alpha[0-9]+
      - v0.[0-9]+.[0-9]+-ascendc[0-9]+

  pull_request:
    branches:
      - master

  workflow_dispatch:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write  # Required for OIDC

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: 'sudu-editor'
      - name: Checkout TeaVM
        uses: actions/checkout@v7
        with:
          repository: 'kirillp/teavm'
          ref: 'master'
          path: 'teavm'
      - name: Checkout Antlr4 TeaVM compatible repo
        uses: actions/checkout@v7
        with:
          repository: 'pertsevpv/antlr4-teavm-compatible'
          ref: 'master'
          path: 'antlr4'
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Node
        uses: actions/setup-node@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          node-version: '26' # Node 20 or 24 is required for modern npm
          registry-url: 'https://registry.npmjs.org'
          scope: '@sudu-ide'
      - name: Upgrade npm CLI
        if: github.event_name == 'push' && github.ref_type == 'tag'
        # Trusted Publishing requires npm v11.5.1 or newer
        run: npm install -g npm@latest
      - name: Restore Maven and Gradle Cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: sudu-editor-cache
      - name: Maven TeaVM
        run: |
          cd $GITHUB_WORKSPACE/teavm
          ./gradlew publishToMavenLocal --no-daemon -x test
      - name: Maven Antlr4
        run: |
          cd $GITHUB_WORKSPACE/antlr4
          mvn install -DskipTests
      - name: Maven Sudu Editor, Code Review and DiffEngine
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          cd $GITHUB_WORKSPACE/sudu-editor
          LANG_FLAGS=""
          if [[ "${{ github.ref_name }}" == *-ascendc* ]]; then
            LANG_FLAGS="-Dsudu.lang.java=false -Dsudu.lang.cpp=false -Dsudu.lang.js=false -Dsudu.lang.ts=false -Dsudu.lang.activity=false -Dsudu.lang.html=false -Dsudu.lang.json=false -Dsudu.lang.python=false -Dsudu.lang.ascendc=true"
            echo "::notice::ascend-c-only language flags enabled"
          fi
          mvn package -am -pl :codicon -pl :fonts -P downloadFont
          mvn package -am -pl demo-edit-js,demo-edit-es-module -P build-ssh,release $LANG_FLAGS
          mvn package -am -pl code-review-module $LANG_FLAGS
      - name: Save Maven Cache
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: sudu-editor-cache
      - name: Publish Sudu Editor packages to NPM Registry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          NEW_VERSION=$(echo ${{ github.ref_name }} | tr -d 'v')
          echo "::notice::version \"${NEW_VERSION}\""
          if [[ "$NEW_VERSION" == *-ascendc* ]]; then
            NPM_TAG="ascendc"
          elif [[ "$NEW_VERSION" == *-* ]]; then
            NPM_TAG="alpha"
          else
            NPM_TAG="latest"
          fi
          echo "::notice::npm tag \"${NPM_TAG}\""
          cd $GITHUB_WORKSPACE/sudu-editor/common-ts-types
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/sudu-editor/demo-edit-es-module/module
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --tag "$NPM_TAG"
          cd $GITHUB_WORKSPACE/sudu-editor/code-review-module/module
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
          npm pkg set "dependencies.@sudu-ide/types=$NEW_VERSION"
          npm publish --access public --tag "$NPM_TAG"
